name: Supabase keep-alive

# Supabase free-tier projects are paused after ~7 days with no API activity.
# This workflow makes a real query on a schedule so the project never goes idle.
#
# No setup required: it falls back to the project URL and anon key that are
# already public in src/lib/supabase.ts. To point it at a different project,
# set these in repo Settings -> Secrets and variables -> Actions and they win:
#   SUPABASE_URL       e.g. https://<your-ref>.supabase.co
#   SUPABASE_ANON_KEY  the anon/publishable key
#
# Never put the Postgres connection string or service_role key here. A read
# against a public table is all that is needed to count as activity.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository
# activity. If this repo goes quiet that long, the schedule stops silently and
# the project will pause. For a pinger that does not depend on repo activity,
# point cron-job.org or UptimeRobot at the same REST URL used below.

on:
  schedule:
    # 07:00 UTC daily — well inside the ~7 day pause window, with room for
    # GitHub's scheduler to run late under load.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Fall back to the values already committed in src/lib/supabase.ts.
          default_url="https://rdxxbhcfsbogaplzdspi.supabase.co"
          default_key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkeHhiaGNmc2JvZ2FwbHpkc3BpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NDE2MjMsImV4cCI6MjA5MzQxNzYyM30.xiTPuUSSBz2CzIBwnRgnqT98JlEDi9xEv3Tj1WybOpQ"

          url_base="${SUPABASE_URL:-$default_url}"
          key="${SUPABASE_ANON_KEY:-$default_key}"

          url="${url_base%/}/rest/v1/site_content?select=key&limit=1"
          echo "Pinging ${url_base}"

          # Retry: a project resuming from cold start can take a few seconds.
          for attempt in 1 2 3; do
            # Truncate first: curl leaves the previous attempt's body in place
            # if the connection fails, which makes the log lie.
            : > /tmp/out.txt
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" \
              --max-time 30 "$url" || true)
            code="${code:-000}"

            echo "attempt ${attempt}: HTTP ${code}"

            if [ "$code" = "200" ]; then
              echo "Keep-alive OK — project is awake."
              head -c 200 /tmp/out.txt || true
              exit 0
            fi

            echo "body: $(head -c 300 /tmp/out.txt 2>/dev/null || true)"
            [ "$attempt" -lt 3 ] && sleep 15
          done

          echo "::error::Keep-alive failed (last HTTP ${code}). Project may be paused, deleted, or the key rotated."
          exit 1
